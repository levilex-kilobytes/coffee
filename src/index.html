<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coffee masters</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- NAV -->
    <header class="head">
      <h1 class="head__brand">
        <img
          src="https://btholt.github.io/complete-intro-to-web-dev-v3/images/coffee_masters_logo.png"
          alt="coffee masters logo"
          class="nav__logo"
        />
        Coffee Masters
      </h1>
    </header>

    <div class="page">
      <!-- ORDER -->
      <section class="order">
        <h2 class="order__title">ITEMS</h2>
        <ul class="order__list">
          <li class="order__item">
            <div class="order__item-quantity">1x</div>
            <div class="order__item-name">Cappuccino</div>
            <div class="order__item-price">$6.00</div>
            <ul class="order__item-options">
              <li class="order__item-option">Light Foam</li>
            </ul>
          </li>
          <li class="order__item">
            <div class="order__item-quantity">1x</div>
            <div class="order__item-name">Cappuccino</div>
            <div class="order__item-price">$7.90</div>
            <ul class="order__item-options">
              <li class="order__item-option">Almond Milk</li>
              <li class="order__item-option">Double Espresso Shot</li>
            </ul>
          </li>
          <li class="order__item">
            <div class="order__item-quantity">1x</div>
            <div class="order__item-name">Croissant</div>
            <div class="order__item-price">$5.37</div>
            <ul class="order__item-options">
              <li class="order__item-option">Butter</li>
            </ul>
          </li>
        </ul>
      </section>

      <!-- PAYMENT -->
      <section class="payment">
        <div class="payment__name">
          <h2 class="payment__title">NAME</h2>
          <div class="payment__field">
            <label class="payment__label" for="name">Name for order</label>
            <input type="text" class="payment__input" id="name" />
          </div>
        </div>
        <div class="payment__card">
          <h2 class="payment__title">PAYMENT</h2>
          <div class="payment__field">
            <label class="payment__label" for="cc">Card number</label>
            <input type="text" class="payment__input" id="cc" />
          </div>
          <div class="payment__field">
            <label class="payment__label" for="ccv">CCV number</label>
            <input
              type="text"
              class="payment__input payment__input--short"
              id="ccv"
            />
          </div>
        </div>
      </section>

      <!-- TOTAL -->
      <section class="summary">
        <table class="summary__table">
          <tbody>
            <tr class="summary__row">
              <td class="summary__label">Subtotal:</td>
              <td class="summary__value">$19.27</td>
            </tr>
            <tr class="summary__row">
              <td class="summary__label">Tax:</td>
              <td class="summary__value">$0.96</td>
            </tr>
            <tr class="summary__row summary__row--total">
              <td class="summary__label">Total:</td>
              <td class="summary__value">$20.23</td>
            </tr>
          </tbody>
        </table>
        <button class="summary__button" type="button">Place order</button>
      </section>
    </div>
  </body>
</html>
